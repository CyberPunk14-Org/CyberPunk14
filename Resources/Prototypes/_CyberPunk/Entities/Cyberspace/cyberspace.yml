# Things in cyberspace (CyberspaceSystem): the nodes on the pads of networked machines, the barriers that keep
# walkers to the paths, and the ICE that guards them.

- type: entity
  id: CyberspaceBarrier
  name: static
  description: The noise between the paths of cyberspace. Nothing gets through it.
  categories: [ HideSpawnMenu ]
  components:
  - type: Physics
    bodyType: Static
  # CyberspaceSystem gives it its walls at runtime. A client applies the body's state before its fixtures', and won't
  # let a body without fixtures collide, so it starts with one that touches nothing.
  - type: Fixtures
    fixtures:
      placeholder:
        shape:
          !type:PhysShapeCircle
          radius: 0.1
        hard: false

- type: entity
  abstract: true
  id: CyberNodeBase
  name: node
  description: A machine on the network, as it stands in cyberspace.
  components:
  - type: CyberNode
  - type: Sprite
    sprite: _CyberPunk/Cyberspace/node.rsi
    state: diamond
    drawdepth: Objects
    noRot: true
  - type: Clickable

- type: entity
  parent: CyberNodeBase
  id: CyberNodeBackbone
  categories: [ HideSpawnMenu ]
  description: The backbone of the city's network, joining every network to every other.
  components:
  - type: Sprite
    state: backbone
    color: "#F2E5FF"
    scale: 2, 2

- type: entity
  parent: CyberNodeBase
  id: CyberNodeRouter
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: circle
    color: "#FF4DE6"

- type: entity
  parent: CyberNodeBase
  id: CyberNodeSwitch
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: square
    color: "#4DE6FF"

- type: entity
  parent: CyberNodeBase
  id: CyberNodeComputer
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    color: "#4DFF73"

- type: entity
  parent: CyberNodeBase
  id: CyberNodeDoorController
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    color: "#FFBF33"

- type: entity
  parent: CyberNodeBase
  id: CyberNodeCamera
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    color: "#FF8066"

- type: entity
  parent: CyberNodeBase
  id: CyberNodeDevice
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    color: "#999999"

- type: entity
  parent: CyberNodeBase
  id: CyberNodeAccessPoint
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    color: "#738CFF"

- type: entity
  parent: CyberNodeBase
  id: CyberNodeDeck
  categories: [ HideSpawnMenu ]
  description: A runner's deck, on the network it came in through.
  components:
  - type: Sprite
    state: triangle
    color: "#FFF24D"

# A firewall's pad: a locked door filling it, which lets through only the runners whose ID passes the firewall's
# reader, or who breached it.
- type: entity
  parent: CyberNodeBase
  id: CyberNodeFirewall
  categories: [ HideSpawnMenu ]
  description: A firewall, shut like a locked door to anyone whose ID it doesn't pass. Stand at it to breach it.
  components:
  - type: Sprite
    state: firewall
    color: "#FF4D59"
    scale: 3, 3
  - type: CyberFirewallGate
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      gate:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.5,-1.5,1.5,1.5"
        hard: true
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable

# ICE: a guard run by a program on one of the network's computers. Its colour shows how alert its program says it
# is.
- type: entity
  id: CyberIce
  name: ICE
  description: Intrusion countermeasures, guarding this network.
  categories: [ HideSpawnMenu ]
  components:
  - type: Ice
  - type: Sprite
    sprite: _CyberPunk/Cyberspace/node.rsi
    drawdepth: Mobs
    noRot: true
    layers:
    - state: ice
      color: "#BF4DFF"
      shader: unshaded
      map: [ "enum.IceVisuals.Mode" ]
  - type: Clickable
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.IceVisuals.Mode:
        enum.IceVisuals.Mode:
          Patrolling: { color: "#BF4DFF" }
          Searching: { color: "#FFCC26" }
          Engaging: { color: "#FF2633" }

# A runner's virtual body: their mind walks it while their real body stays behind. It's a computer, their deck.
# It takes the shape of their body, without the insides: it doesn't breathe, eat or feel the cold, and it bleeds
# ghostlight. It shows, with all it wears and holds, in a glitching shade of its runner's colour.
- type: entity
  parent: [ BaseSpeciesMob, MobBloodstream ]
  id: CyberAvatar
  name: runner
  description: Someone's mind, walking the network.
  categories: [ HideSpawnMenu ]
  components:
  - type: HumanoidProfile
    species: CyberAvatar
  - type: InitialBody
    organs: {}
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Ghostlight
        Quantity: 600
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#4DD9FF"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: CyberAvatar
  - type: DoAfter
  - type: WasmMachine
    kind: Deck
    filesFrom: ComputerProgrammable
    files:
      readme.txt: |
        YOUR DECK

        This is your deck: your virtual body is a computer, and this is its disk.
        It keeps its files between runs, and its programs reach whatever network
        you jacked into (ip shows your address on it). It has the examples a
        programmable computer has: `ls examples`, then `cat` one.

        Walk the paths to find the machines on the network: each has a node on
        its pad, and the router's pad opens onto the bus that joins every
        network to the backbone. Use a node to open its machine; one your ID
        doesn't open takes three seconds at its node to breach. So does a
        firewall, which shuts the way past it to anyone whose ID it doesn't pass.

        ICE guards the networks: violet while it patrols, yellow while it
        searches and red when it comes for you. Three seconds in its sight is
        enough. It leaves alone runners whose ID its computer passes.

        `hold blade` puts your deck's weapon in your hand: use it on ICE or
        another runner to strike them, until the ICE derezzes or the runner is
        cut out of cyberspace. `hold ward` is a shield that halves strikes on
        you for two seconds. Build your own
        with `new NAME deck`, then hold the program it builds (man deck).

        `push FILE` copies a file onto the computer whose node you stand at,
        once you're through its lock; `push ADDR FILE` copies it over the
        network to a computer your ID opens.

        Jack out from the action bar, and open this terminal again from there.
        Lose your deck, your body or your way, and you're thrown out with
        dumpshock: ten seconds before you can jack in again.
  - type: UserInterface
    interfaces:
      enum.MachineTerminalUiKey.Key:
        type: MachineTerminalBoundUserInterface
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface

# What a runner's virtual body takes from them, besides the look of their body.
- type: cloningSettings
  id: CyberAvatar
  copyEquipment: null
  copyInternalStorage: false
  copyImplants: false
  copyStatusEffects: false
  components:
  - DetailExaminable
  - ScaleVisuals
  - Speech
  - TypingIndicator
  eventComponents:
  - Hands
  - Inventory
  - EyeBlinking

# What every runner's virtual body wears. It's part of them, so none of it comes off.
- type: startingGear
  id: CyberAvatar
  equipment:
    jumpsuit: ClothingUniformCyberAvatar
    shoes: ClothingShoesCyberAvatar
    id: CyberProxyIdCard

- type: entity
  parent: UnsensoredClothingUniformBase
  id: ClothingUniformCyberAvatar
  name: runner's skin
  description: The shape a mind takes on the network.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuits/Special/ninja.rsi
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuits/Special/ninja.rsi
  - type: Unremoveable

- type: entity
  parent: ClothingShoesBase
  id: ClothingShoesCyberAvatar
  name: runner's treads
  description: Soles for walking the paths of cyberspace.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Specific/spaceninja.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Specific/spaceninja.rsi
  - type: Unremoveable

- type: entity
  parent: BaseItem
  id: CyberProxyIdCard
  name: proxy ID
  description: A runner's ID as cyberspace sees it. It opens whatever the ID their body wears opens.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Misc/id_cards.rsi
    state: ninja
  - type: Clothing
    slots:
    - idcard
    sprite: Objects/Misc/id_cards.rsi
  - type: Item
    size: Small
    heldPrefix: default
  - type: Unremoveable
  - type: IdCard
    nameLocId: cyberspace-proxy-id-name
    fullNameLocId: cyberspace-proxy-id-full-name
  - type: CyberProxyId

# A program in a runner's virtual hand: used, it runs on their deck, at whatever it's used on. Dropped, it's gone.
- type: entity
  parent: BaseItem
  id: CyberProgram
  name: program
  description: A program, held ready. Use it to run it, or use it on something to run it at that.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Misc/cd.rsi
    state: icon
    color: "#80E5FF"
  - type: Item
    size: Tiny
    sprite: Objects/Misc/cd.rsi
  - type: CyberProgram

# The computer of a practice grid, on nobody's network but the grid's.
- type: entity
  id: CyberTrainingServer
  name: training server
  categories: [ HideSpawnMenu ]
  components:
  - type: WasmMachine
    files:
      readme.txt: |
        TRAINING SERVER

        A practice network's server: nobody else's, and nobody else's ICE.
        Your deck reaches it, and it reaches your deck. Out in the city, every
        network has a router, and its pad opens onto the bus to the others.
  - type: UserInterface
    interfaces:
      enum.MachineTerminalUiKey.Key:
        type: MachineTerminalBoundUserInterface

- type: entity
  parent: BaseItem
  id: Cyberdeck
  name: cyberdeck
  description: A netrunner's deck. Use it on a networked machine to jack into cyberspace, or in your hand to practise on a network of your own; your body stays behind.
  components:
  - type: Sprite
    sprite: Objects/Devices/tablets.rsi
    state: syndie
  - type: Item
    size: Small
    inhandVisuals:
      left:
      - state: inhand-left-syndie
      right:
      - state: inhand-right-syndie
  - type: Cyberdeck
  - type: GuideHelp
    guides:
    - Cyberspace

- type: entity
  parent: [ BaseWallmountMetallic, BaseWallmountMachine, StructureHealthMachineWeak ]
  id: AccessPoint
  name: access point
  description: A network port in the wall. Use a cyberdeck on it to jack into cyberspace; on data cable to a powered router, it's on that router's network.
  components:
  - type: AccessPoint
  - type: ApcPowerReceiver
    powerLoad: 30
  - type: Sprite
    sprite: Structures/Wallmounts/station-map.rsi
    offset: 0, -0.25
    color: "#80E5FF"
    layers:
    - state: base
    - state: unshaded
      shader: unshaded
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: GuideHelp
    guides:
    - Cyberspace

- type: entity
  parent: BaseAction
  id: ActionCyberJackOut
  name: Jack out
  description: Leave cyberspace and go back to your body.
  components:
  - type: Action
    checkCanInteract: false
  - type: Sprite
    sprite: Interface/Actions/actions_ai.rsi
    layers:
    - state: emergency_off
  - type: InstantAction
    event: !type:CyberJackOutActionEvent

- type: entity
  parent: BaseAction
  id: ActionCyberOpenDeck
  name: Open deck
  description: Open your deck's terminal.
  components:
  - type: Action
    checkCanInteract: false
  - type: Sprite
    sprite: Interface/Actions/actions_ai.rsi
    layers:
    - state: comms_console
  - type: InstantAction
    event: !type:CyberOpenDeckActionEvent
