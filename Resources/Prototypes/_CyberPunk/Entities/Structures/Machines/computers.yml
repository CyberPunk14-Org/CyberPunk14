- type: entity
  parent: BaseComputer
  id: ComputerProgrammable
  name: programmable computer
  description: A general-purpose computer. It runs programs, and boots a small shell when it has power.
  components:
  - type: WasmMachine
    files:
      readme.txt: |
        This computer runs programs, which you write in Wire (`man wire`) or
        by hand in its assembly language, WAT (`man wat`).
        Type `help` for the shell's commands, and `man` for the manual.
        Try `new hello`, `build hello.wire` and `run hello.bin` for your first
        Wire program. The examples folder has more: `ls examples`, then `cat` one.
        The shell itself is a Wire program you can read and replace: `man boot`.
        `examples/calc.wire` is a calculator with its own buttons (`man ui`).
        Try `build keys.wat` and `run keys.bin` to see raw mode.
        Data cable to a powered router networks it: `ip` shows its address,
        `hostname NAME` names it, and `hosts` lists every name the router knows.
      hello.wat: (module (import "sb_v6" "term_write" (func $write (param i32 i32))) (memory (export "memory") 1) (data (i32.const 0) "Hello from a program!\n") (func (export "start") (call $write (i32.const 0) (i32.const 22))))
      keys.wat: |
        ;; Raw mode: prints the code of each key pressed, until Ctrl+Q.
        (module
          (import "sb_v6" "term_raw" (func $raw (param i32)))
          (import "sb_v6" "term_key" (func $key (result i32)))
          (import "sb_v6" "term_write" (func $write (param i32 i32)))
          (import "sb_v6" "exit" (func $exit (param i32)))
          (memory (export "memory") 1)
          (data (i32.const 0) "Raw mode: each key you press shows its code. Ctrl+Q quits.\n")
          (data (i32.const 100) "key ")
          (func (export "start")
            (call $raw (i32.const 1))
            (call $write (i32.const 0) (i32.const 59)))
          (func (export "tick")
            (local $k i32) (local $p i32) (local $n i32)
            (block $done
              (loop $next
                (local.set $k (call $key))
                (br_if $done (i32.lt_s (local.get $k) (i32.const 0)))
                (if (i32.eq (local.get $k) (i32.const 17))
                  (then
                    (call $raw (i32.const 0))
                    (call $exit (i32.const 0))
                    (return)))
                ;; The code in decimal, written backwards from a newline at 120.
                (i32.store8 (i32.const 120) (i32.const 10))
                (local.set $p (i32.const 120))
                (local.set $n (local.get $k))
                (loop $digit
                  (local.set $p (i32.sub (local.get $p) (i32.const 1)))
                  (i32.store8 (local.get $p) (i32.add (i32.const 48) (i32.rem_u (local.get $n) (i32.const 10))))
                  (local.set $n (i32.div_u (local.get $n) (i32.const 10)))
                  (br_if $digit (local.get $n)))
                (call $write (i32.const 100) (i32.const 4))
                (call $write (local.get $p) (i32.sub (i32.const 121) (local.get $p)))
                (br $next)))))
      examples/hello.wire: |
        # hello.wire: prints a greeting and what is on the disk.
        #     build examples/hello.wire
        #     run examples/hello.bin

        print("Hello from a Wire program!")
        print("This computer has been up for", sys.clock(), "ms.")
        print("Files on its disk:", ", ".join(fs.files()))
      examples/spin.wire: |
        # spin.wire: a badly behaved program, an endless loop. The machine's fuel
        # budget stops it on its first go, and everything else carries on.
        #     run examples/spin.bin

        print("Spinning forever...")
        n = 0
        while True:
            n += 1
      examples/echo_server.wire: |
        # echo_server.wire: an echo server. It answers every packet sent to this
        # computer's port 7 with the same text, and shows what it got. Type quit
        # to stop it. Try it with ping from another computer, by this one's
        # address or by its name (hostname NAME sets one).
        #     run examples/echo_server.bin

        ECHO = 7

        me = net.address()
        if me == None:
            print("echo server: this computer has no network address")
            sys.exit(1)
        else:
            name = net.hostname()
            if name != None:
                me = name + " (" + me + ")"
            print("echo server listening on", me, "port", ECHO)
            print("(type quit to stop)")

        def tick():
            for packet in net.receive():
                if packet.port == ECHO:
                    print(packet.sender, "says:", packet.text)
                    net.send(packet.sender, ECHO, packet.text)
            line = term.read_line()
            if line != None and line.strip() == "quit":
                print("echo server stopped")
                sys.exit()
      examples/ping.wire: |
        # ping.wire: sends a message to the echo server (port 7) at an address or
        # hostname and waits up to three seconds for it to come back.
        #     run examples/ping.bin HOST [MESSAGE]

        ECHO = 7
        TIMEOUT = 3000

        target = None
        address = None
        sent = 0
        words = sys.args().split()
        if len(words) == 0:
            print("usage: run ping.bin HOST [MESSAGE]   (an address or a hostname)")
            sys.exit(1)
        else:
            target = words.pop(0)
            address = net.resolve(target)
            message = " ".join(words)
            if message == "":
                message = "ping"
            if address == None:
                print("ping " + target + ": unknown host (try hosts)")
                sys.exit(1)
            elif net.send(address, ECHO, message):
                if address != target:
                    target = target + " (" + address + ")"
                print("ping " + target + ": " + message)
                sent = sys.clock()
            else:
                print("ping " + target + ": can't send")
                sys.exit(1)

        def tick():
            elapsed = sys.clock() - sent
            for packet in net.receive():
                if packet.sender == address and packet.port == ECHO:
                    print("reply from", target, "in", elapsed, "ms:", packet.text)
                    sys.exit(0)
                    return
            if elapsed > TIMEOUT:
                print("no reply from", target)
                sys.exit(1)
      examples/opendoor.wire: |
        # opendoor.wire: sends a command to the door controller at an address (or
        # hostname) and shows what it says back. The command is open if you give
        # none; the stock door firmware also takes close, bolt, unbolt and status
        # (man firmware).
        # Find the building's door controllers with netscan.
        #     run examples/opendoor.bin HOST [COMMAND]
        #     run examples/opendoor.bin 10.4.1.3 open

        DOOR = 1701
        TIMEOUT = 3000

        target = None
        address = None
        sent = 0
        words = sys.args().split()
        if len(words) == 0:
            print("usage: run opendoor.bin HOST [COMMAND]   (man firmware)")
            sys.exit(1)
        else:
            target = words[0]
            address = net.resolve(target)
            command = "open"
            if len(words) > 1:
                command = words[1]
            if address != None and net.send(address, DOOR, command):
                sent = sys.clock()
            else:
                print("door " + target + ": can't send (is it on this network?)")
                sys.exit(1)

        def tick():
            for packet in net.receive():
                if packet.sender == address and packet.port == DOOR:
                    print("door " + target + ": " + packet.text)
                    sys.exit(0)
                    return
            if sys.clock() - sent > TIMEOUT:
                print("door " + target + ": no answer")
                sys.exit(1)
      examples/netscan.wire: |
        # netscan.wire: lists the other machines on this building's network, then
        # asks each whether it is a door controller (port 1701) or a camera (port
        # 1702), and shows what answers within a second, with the hostnames the
        # router knows.
        #     run examples/netscan.bin

        DOOR = 1701
        CAMERA = 1702
        WAIT = 1000

        queue = []
        found = {}
        names = {}
        started = 0

        me = net.address()
        if me == None:
            print("netscan: this computer has no network address")
            sys.exit(1)
        else:
            queue = net.neighbours()
            hosts = net.hosts()
            for name in hosts.keys():
                names[hosts[name]] = name
            print(me + ":", len(queue), "other hosts on this network")
            started = sys.clock()

        def tick():
            # A few hosts a tick: a machine may only send so many packets at once.
            asked = 0
            while asked < 4 and len(queue) > 0:
                host = queue.pop()
                net.send(host, DOOR, "status")
                net.send(host, CAMERA, "count")
                found[host] = "host"
                asked += 1
            if len(queue) > 0:
                started = sys.clock()
            for packet in net.receive():
                if packet.port == DOOR:
                    found[packet.sender] = "door controller (door " + packet.text + ")"
                elif packet.port == CAMERA:
                    found[packet.sender] = "camera (sees " + packet.text + ")"
            if sys.clock() - started > WAIT:
                for host in sorted(found.keys()):
                    label = host
                    if host in names:
                        label = host + " " + names[host]
                    print("  " + label, found[host])
                sys.exit(0)
      examples/machines.wire: |
        # machines.wire: lists the machines on this building's network that people
        # work through a window (vending machines, consoles and the like), with
        # the calls each one takes (man dev).
        #     run examples/machines.bin

        queue = []
        seen = 0

        if net.address() == None:
            print("machines: this computer has no network address")
            sys.exit(1)
        else:
            queue = sorted(net.neighbours())

        def tick():
            # A few a tick: a computer can only make so many requests at once.
            asked = 0
            while asked < 4 and len(queue) > 0:
                host = queue.pop(0)
                asked += 1
                info = dev.info(host)
                if info != None:
                    seen += 1
                    print(host, info["name"], "(" + str(info["kind"]) + ")")
                    for call in info["calls"].keys():
                        print("    " + call, info["calls"][call])
            if len(queue) == 0:
                if seen == 0:
                    print("machines: none on this network")
                sys.exit(0)
      examples/calc.wire: |
        # calc.wire: a calculator with buttons, to show how a program draws its
        # own UI (man ui). The terminal window shows the buttons in place of the
        # text while it runs. Wire numbers are whole numbers, so 7 / 2 is 3.
        #     build examples/calc.wire
        #     run examples/calc.bin

        # The buttons, a row at a time: each is [id, text]. Ids are what come
        # back in events when the button is clicked.
        KEYS = [
            [["num7", "7"], ["num8", "8"], ["num9", "9"], ["div", "/"]],
            [["num4", "4"], ["num5", "5"], ["num6", "6"], ["mul", "*"]],
            [["num1", "1"], ["num2", "2"], ["num3", "3"], ["sub", "-"]],
            [["clear", "C"], ["num0", "0"], ["eq", "="], ["add", "+"]],
        ]
        SYMBOLS = {"add": "+", "sub": "-", "mul": "*", "div": "/"}

        display = "0"     # the number on show
        total = 0         # the number before the operation waiting
        pending = None    # that operation's id, or None
        fresh = True      # whether the next digit starts a new number

        def calculate(a, b, op):
            if op == "add":
                return a + b
            if op == "sub":
                return a - b
            if op == "mul":
                return a * b
            if b == 0:
                return None
            return a / b

        def press(id):
            if id == "clear":
                display = "0"
                total = 0
                pending = None
                fresh = True
            elif id.startswith("num"):
                if fresh or display == "0":
                    display = id[3]
                elif len(display) < 15:
                    display += id[3]
                fresh = False
            elif display != "Error":
                value = int(display)
                if pending != None and not fresh:
                    value = calculate(total, value, pending)
                    if value == None:
                        display = "Error"
                        pending = None
                        fresh = True
                        return
                    display = str(value)
                total = value
                pending = None
                if id != "eq":
                    pending = id
                fresh = True

        # Builds the whole UI from the state, and shows it. Showing the same UI
        # again costs nothing, so a program can just redraw after every change.
        def show():
            sum = ""
            if pending != None:
                sum = str(total) + " " + SYMBOLS[pending]
            rows = [ui.label(sum), ui.label(display)]
            for keys in KEYS:
                buttons = []
                for key in keys:
                    buttons.append(ui.button(key[0], key[1]))
                rows.append(ui.row(buttons))
            rows.append(ui.button("quit", "Quit"))
            ui.show(ui.column(rows))

        def tick():
            for event in ui.events():
                if event.id == "quit":
                    ui.clear()
                    print("calc: bye")
                    sys.exit()
                    return
                press(event.id)
            show()

        print("calc: click the buttons; Quit ends it.")
        show()
  - type: NodeContainer
    nodes:
      data:
        !type:CableDeviceNode
        nodeGroupID: Data
  - type: GuideHelp
    guides:
    - Computers
  - type: ActivatableUI
    key: enum.MachineTerminalUiKey.Key
  - type: UserInterface
    interfaces:
      enum.MachineTerminalUiKey.Key:
        type: MachineTerminalBoundUserInterface

- type: entity
  parent: ComputerProgrammable
  id: ComputerProgrammableDev
  suffix: Dev room
  components:
  - type: WasmMachine
    files:
      dev/readme.txt: |
        Programs for trying out the machines in this room from a computer
        (man dev). Build one, then run it:
          build dev/vend.wire      then  run dev/vend.bin [ITEM]
          build dev/heater.wire    then  run dev/heater.bin [on|off|heat|cool|auto|warmer|cooler]
          build dev/jukebox.wire   then  run dev/jukebox.bin
        examples/machines.wire lists every machine on the network and its calls.
      dev/vend.wire: |
        # dev/vend.wire: works the vending machines on this network from here.
        #     run dev/vend.bin          lists what each one has
        #     run dev/vend.bin ITEM     vends ITEM (an id from that list)

        want = sys.args().strip()
        queue = net.neighbours()
        machines = []

        if net.address() == None:
            print("vend: this computer isn't on a network")
            sys.exit(1)

        # What a vending machine has, as a dict from item id to its entry.
        def stock(host):
            state = dev.state(host)
            if state == None:
                return {}
            vending = state.get("VendingMachine")
            if vending == None:
                return {}
            return vending["Inventory"]

        def tick():
            # A few machines a tick: a computer can only make so many requests at once.
            asked = 0
            while asked < 3 and len(queue) > 0:
                host = queue.pop(0)
                asked += 1
                info = dev.info(host)
                if info != None and str(info["kind"]).startswith("VendingMachine"):
                    machines.append([host, info["name"]])
            if len(queue) > 0:
                return
            if len(machines) == 0:
                print("vend: there are no vending machines on this network")
                sys.exit(1)
            for machine in machines:
                items = stock(machine[0])
                if want == "":
                    print(machine[0], machine[1])
                    for id in sorted(items.keys()):
                        print("   ", id, items[id]["Amount"])
                elif want in items:
                    if dev.call(machine[0], "vending_machine_eject", {"type": items[want]["Type"], "id": want}):
                        print("vend: " + machine[1] + " is vending " + want)
                    else:
                        print("vend: " + sys.error())
                    sys.exit(0)
            if want != "":
                print("vend: nothing here has " + want)
            sys.exit(0)
      dev/heater.wire: |
        # dev/heater.wire: works the space heater on this network from here.
        #     run dev/heater.bin                 shows what it's set to
        #     run dev/heater.bin on              (or off) switches it on or off
        #     run dev/heater.bin heat            (or cool, auto) sets its mode
        #     run dev/heater.bin warmer          (or cooler) moves its target by 5 degrees

        what = sys.args().strip()
        queue = net.neighbours()
        heater = None

        if net.address() == None:
            print("heater: this computer isn't on a network")
            sys.exit(1)

        # What its window shows. Nudging the target by nothing makes it say.
        def settings():
            dev.call(heater, "space_heater_change_temperature", {"temperature": 0})
            state = dev.state(heater)
            if state == None:
                return None
            return state["ui"]

        def show():
            s = settings()
            if s == None:
                print("heater: " + sys.error())
                return
            on = "off"
            if s["Enabled"]:
                on = "on"
            print("heater " + heater + ": " + on + ", " + s["Mode"] + " mode, aiming for",
                s["TargetTemperature"] - 273, "C")

        def act():
            if what == "":
                pass
            elif what == "on" or what == "off":
                s = settings()
                if s != None and s["Enabled"] != (what == "on"):
                    dev.call(heater, "space_heater_toggle")
            elif what == "heat" or what == "cool" or what == "auto":
                dev.call(heater, "space_heater_change_mode", {"mode": what})
            elif what == "warmer":
                dev.call(heater, "space_heater_change_temperature", {"temperature": 5})
            elif what == "cooler":
                dev.call(heater, "space_heater_change_temperature", {"temperature": -5})
            else:
                print("heater: try on, off, heat, cool, auto, warmer or cooler")
                sys.exit(1)

        def tick():
            asked = 0
            while heater == None and asked < 3 and len(queue) > 0:
                host = queue.pop(0)
                asked += 1
                info = dev.info(host)
                if info != None and str(info["kind"]).startswith("SpaceHeater"):
                    heater = host
            if heater == None:
                if len(queue) == 0:
                    print("heater: there's no space heater on this network")
                    sys.exit(1)
                return
            # Work it on the next tick, with this tick's requests spent on finding it.
            if asked > 0:
                return
            act()
            show()
            sys.exit(0)
      dev/jukebox.wire: |
        # dev/jukebox.wire: a remote control for the jukebox on this network,
        # with buttons (man ui).
        #     run dev/jukebox.bin

        SONGS = ["FlipFlap", "Tintin", "Thunderdome", "Constellations", "Drifting", "starlight"]

        queue = net.neighbours()
        box = None
        status = "Looking for the jukebox..."

        def show():
            ui.show(ui.column([
                ui.label("Jukebox remote"),
                ui.label(status),
                ui.list("songs", SONGS),
                ui.row([
                    ui.button("play", "Play"),
                    ui.button("pause", "Pause"),
                    ui.button("stop", "Stop"),
                    ui.button("quit", "Quit"),
                ]),
            ]))

        # Presses something on the jukebox, and says how it went.
        def press(call, args, done):
            if box == None:
                status = "There's no jukebox to work yet."
            elif dev.call(box, call, args):
                status = done
            else:
                status = "That didn't work: " + sys.error()

        def tick():
            asked = 0
            while box == None and asked < 3 and len(queue) > 0:
                host = queue.pop(0)
                asked += 1
                info = dev.info(host)
                if info != None and info["kind"] == "Jukebox":
                    box = host
                    status = "Found the jukebox at " + host + ". Pick a song, then Play."
            if box == None and len(queue) == 0:
                status = "There's no jukebox on this network."
            for e in ui.events():
                if e.id == "quit":
                    ui.clear()
                    sys.exit(0)
                elif e.id == "songs":
                    song = SONGS[int(e.value)]
                    press("jukebox_selected", {"song_id": song}, "Picked " + song + ".")
                elif e.id == "play":
                    press("jukebox_playing", None, "Playing.")
                elif e.id == "pause":
                    press("jukebox_pause", None, "Paused.")
                elif e.id == "stop":
                    press("jukebox_stop", None, "Stopped.")
            show()

        show()

# A computer that guards its network: it starts two ICE at boot. Its reader decides who the ICE leaves alone.
- type: entity
  parent: ComputerProgrammable
  id: ComputerProgrammableSecurity
  name: security computer
  description: A programmable computer that guards its network. At boot it puts ICE in cyberspace, to hunt any netrunner whose ID it doesn't pass.
  components:
  - type: WasmMachine
    hostname: security
    files:
      autorun: |
        run ice_basic &
        run ice_basic &
      security.txt: |
        This computer guards its network. Its autorun file starts two ICE
        (ice_basic) at boot, which walk the network in cyberspace and go after
        any runner whose ID this computer's reader doesn't pass. `jobs` lists
        them; `man ice` says how ICE works, and `new myice ice_basic` copies
        the program to change.
  - type: AccessReader
    access: [["Security"]]
